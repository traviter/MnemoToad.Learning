name: Karate API Tests

on:
  workflow_call:
    inputs:
      tags:
        description: 'Karate tag expression, comma-separated (e.g. @Smoke or @Smoke,@Regression). Blank runs everything.'
        required: false
        default: '@Smoke'
        type: string
      environment:
        description: 'Target environment (only "azure" is actually reachable from a GitHub-hosted runner today)'
        required: false
        default: 'azure'
        type: string
  # schedule:
  #   - cron: '0 9 * * *'   # 09:00 UTC = 02:00 MST (Phoenix, no DST)
  workflow_dispatch:
    inputs:
      tags:
        description: 'Karate tag expression, comma-separated (e.g. @Smoke or @Smoke,@Regression). Blank runs everything.'
        required: false
        default: '@Smoke'
      environment:
        description: 'Target environment (only "azure" is actually reachable from a GitHub-hosted runner today)'
        required: true
        default: 'azure'
        type: choice
        options:
          - azure
          - dev

jobs:
  karate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Determine tags and environment
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tags=@Regression" >> "$GITHUB_OUTPUT"
            echo "env=azure" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "tags=${{ inputs.tags }}" >> "$GITHUB_OUTPUT"
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=@Smoke" >> "$GITHUB_OUTPUT"
            echo "env=azure" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Karate tests
        working-directory: MnemoToad.Learning.Karate
        run: |
          mvn test -Dkarate.env=${{ steps.params.outputs.env }} -Dkarate.tags=${{ steps.params.outputs.tags }}

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: MnemoToad.Learning.Karate/target/karate-reports
